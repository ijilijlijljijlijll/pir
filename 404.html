
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Archivo sin amo</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            min-height: 85vh;
            margin: 0 auto;
            padding: 20px;
            background-color: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.1);
            max-width: 550px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(5rem, 15vw, 9rem);
            margin: 0;
            color: #00f7ff;
            text-shadow: 0 0 5px #00f7ff, 0 0 10px #00a2ff;
        }

        h2 {
            color: #00f7ff;
            font-size: 1.4em;
            margin-top: 10px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            color: #00a2ff;
            font-weight: bold;
            text-decoration: none;
            border: 1px solid #00a2ff;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #00f7ff;
            border-color: #00f7ff;
            text-shadow: 0 0 5px #00a2ff;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
        }

        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.8em;
        }
    </style>
</head>

<body>
    <main class="error">
        <h1>404</h1>
        <h2>Archivo no encontrado</h2>
        <p>
            La dirección que buscas no existe o ya no está disponible.
        </p>

        <a href="/">← VOLVER AL ARCHIVO</a>

        <p id="redirect-message">
            Serás redirigido al archivo en unos segundos...
        </p>
    </main>

    <div class="footer">
        <p>Archivo sin amo ♥</p>
    </div>

    <script>
        setTimeout(function() {
            window.location.replace("/");
        }, 5000);
    </script>
</body>
</html>
